<div class="filtros">
    <div class="row mb-3">
        <div class="col-md-3">
            <label>Categoria:</label>
            <select class="form-select" [(ngModel)]="selectedCategory" name="categoria">
                <option value="">Todas</option>
                <option *ngFor="let categoria of categories" [value]="categoria">{{ categoria }}</option>
            </select>
        </div>
  
        <div class="col-md-3">
            <label>Marca:</label>
            <select class="form-select" [(ngModel)]="selectedBrand" name="marca">
                <option value="">Todas</option>
                <option *ngFor="let marca of marca" [value]="marca">{{ marca }}</option>
            </select>
        </div>
  
        <div class="col-md-2">
          <label>Precio min:</label>
          <input type="number" class="form-control" [(ngModel)]="minprecio" name="minprecio">
      </div>
  
      <div class="col-md-2">
        <label>Precio Max:</label>
        <input type="number" class="form-control" [(ngModel)]="maxprecio" name="maxprecio">
    </div>

    <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-secondary w-100" (click)="resetFilters()">
            <div class="button-top">Limpiar</div>
        </button>
      </div>
      </div>
      </div>


<div class="card-container">

        <!--recorre el arreglo-->
        <ng-container *ngFor="let Producto of productos">
            <!--verifica que el producto esté disponible-->
            <div *ngIf="Producto.disponibilidad" class="card">
              
              
                <!-- From Uiverse.io by andrew-demchenk0 -->

                <!-- cartaaaaaaaa-->

<!--texto de tarjeta-->
                        <div class="texto">
                            <p class="text">
                                <img class="imagen" [src]="Producto.imagen" alt="{{Producto.nombre}}"
                                    class="product-image">

                            <p>{{Producto.descripcion}}</p>

                    </div>
<!--botón-->
                </div>
                <button type="button" class="btn btn-outline-primary" (click)="agregarProducto(Producto)">Agregar al
                    carrito</button>
            </div>

        </ng-container>
    </ng-container>
