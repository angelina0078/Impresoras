<section class="contacto">
  <h1>Contacto</h1>
  <p>¿Querés hacer un pedido, tenés una consulta o simplemente saludarnos?</p>

  <!-- Formulario sin lógica TS -->
  <form class="siu">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required />

    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" placeholder="ejemplo@mail.com" required />

    <label for="mensaje">Mensaje:</label>
    <textarea id="mensaje" name="mensaje" placeholder="Escribí tu mensaje..." required></textarea>

    <button type="submit" onclick="alert('Mensaje enviado (simulado)')">Enviar</button>
  </form>
</section>
